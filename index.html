<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>FlashCards</title>
</head>

<body>
    <header class="cabecalho"> 
        <h1>𝔚𝔢𝔩𝔠𝔬𝔪𝔢 𝔱𝔬 𝔪𝔶 𝔰𝔦𝔱𝔢
        </h1>
        <nav>
            <a href="#" class="cabecalho-link">inicio</a>
        </nav>
    </header>
    <main>
        <h2>Descubra a verdade passando fome</h2>
        <article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://tesouracomponta.com/wp-content/uploads/2025/02/cn-s2-blogroll-1736982110361.jpg"
                        alt="e o caba vai indoida e" class="cartao-imagem">
                    <p>agora eu era heroi e meu cavalo so falava ingleis</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://tesouracomponta.com/wp-content/uploads/2025/02/cn-s2-blogroll-1736982110361.jpg"
                        alt="e o caba vai indoida e" class="cartao-imagem">
                    <p>esse cara deu pra 2...</p>
                </div>
            </div>
        </article>
    </main>
    <footer>
        <p>projeto feito por mim</p>
    </footer>
</body>

</html>
